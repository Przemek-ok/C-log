<!DOCTYPE html>
<html lang="pl">
<head>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C-log v0.17 testowa</title>
<style>
:root{--bg:#000;--surface:#080808;--surface2:#111;--text:#fff;--muted:#bdbdbd;--line:#777;--accent:#ff2020;--accentText:#fff;--field:#050505;--danger:#ff3030}
html[data-theme="light"]{--bg:#fff;--surface:#fff;--surface2:#f3f3f3;--text:#111;--muted:#555;--line:#777;--accent:#e51b23;--accentText:#fff;--field:#fff;--danger:#c9151c}
html[data-theme="green"]{--bg:#06210f;--surface:#0b3017;--surface2:#124321;--text:#fff;--muted:#d1f0d8;--line:#398b50;--accent:#20e05b;--accentText:#001b08;--field:#071d0e;--danger:#ff3030}
html[data-theme="blue"]{--bg:#001a45;--surface:#03245d;--surface2:#073477;--text:#fff;--muted:#c8dcff;--line:#4384d9;--accent:#168cff;--accentText:#fff;--field:#00163c;--danger:#ff3030}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
html{min-height:100vh}
body{font-size:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px))}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:520px;min-height:100vh;margin:auto;padding:36px 12px calc(24px + env(safe-area-inset-bottom, 0px));background:var(--bg);color:var(--text)}
header{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:6px;margin-bottom:10px}
.brand{text-align:center} h1{margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.5px}
.brand-sub{margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.8px}
.header-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:22px}
.header-btn:active,.navtab:active,button:active{transform:scale(.98)}
.status{position:absolute;left:-9999px}
.top-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}
.navtab{min-height:42px;border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-weight:700;font-size:14px}
.navtab.active{border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px}
.section{margin:0 0 10px;font-size:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;margin:0 0 5px 2px;color:var(--text);font-size:13px;font-weight:600}
input,select{width:100%;min-height:46px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:var(--field);color:var(--text);-webkit-text-fill-color:var(--text)}
input::placeholder{color:var(--muted);opacity:1;-webkit-text-fill-color:var(--muted)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,32,32,.18)}
.call{font-size:25px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.freq input{font-size:20px;font-weight:700}
.band-value{min-height:46px;display:flex;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);font-size:18px;font-weight:700}
.small-info{min-height:20px;margin-top:7px;color:var(--muted);font-size:13px}
.reports{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.report-title{margin-bottom:5px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.report input{text-align:center;font-size:30px;font-weight:700}
.quick{display:flex;gap:4px;margin-top:5px}
.quick button{flex:1;min-height:36px;padding:5px 2px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);font-weight:700}
.primary{width:100%;min-height:54px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--accentText);font-size:18px;font-weight:800}
.nav{display:none!important}
.top-tabs{display:none!important}
.nav button,.special button,.list-actions button,.back button{min-height:44px;padding:9px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-weight:700}
.special-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.special button.on{border-color:var(--accent);color:var(--accent)}
.active-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{border:1px solid var(--accent);border-radius:14px;padding:5px 9px;background:var(--surface);color:var(--accent);font-size:12px;font-weight:700}
.list-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:7px}
.list-main{display:flex;justify-content:space-between;gap:8px}.call-list{font-size:17px;font-weight:800}
.meta{margin-top:4px;color:var(--muted);font-size:13px}.empty{padding:28px 5px;text-align:center;color:var(--muted)}
.back{margin-bottom:10px}
.dialog.hidden{display:none!important}.dialog{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);z-index:10}
.dialog-box{width:100%;max-width:420px;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.dialog h2{margin:0 0 10px;font-size:21px}.dialog p{color:var(--muted);font-size:15px;line-height:1.45}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.dialog-actions button{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);font-weight:700}
.dialog-actions .danger{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:11px 16px;border-radius:18px;background:#fff;color:#000;font-size:14px;font-weight:700;z-index:20;display:none}
.list-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.comment-templates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}
.comment-templates button{min-height:38px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);font-size:13px;font-weight:700}
textarea{width:100%;min-height:74px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:var(--field);color:var(--text);font:inherit;resize:vertical}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,32,32,.18)}
.theme-note{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.4}
@media(max-width:370px){.app{padding-left:8px;padding-right:8px}.top-tabs{gap:3px}.navtab{font-size:12px}h1{font-size:27px}}
</style>

<script>
window.addEventListener('error', function(e){
  var el=document.getElementById('jsError');
  if(el){
    el.textContent='Błąd aplikacji: '+(e.message||'JavaScript');
    el.style.display='block';
  }
  console.error(e.message||e.error);
});
</script>
</head>
<body>
<div id="app" class="app">
  <header>
    <button class="header-btn" onclick="showSpecial()" aria-label="Menu">☰</button>
    <div class="brand"><h1>C-log</h1><div class="brand-sub">by SQ3TOM</div></div>
    <button class="header-btn" onclick="showSettings()" aria-label="Ustawienia">⚙</button>
    <div id="clock" class="status"></div>
  </header>
  <div id="jsError" style="display:none;margin:0 0 10px;padding:10px;border:2px solid #ff2020;border-radius:8px;color:#ff2020;font-weight:700;background:#080808"></div><div id="screen"></div>
</div>
<div id="dialog" class="dialog hidden"></div>
<div id="toast" class="toast"></div>

<script>
const KEY='clog_qsos_v1', SETTINGS='clog_settings_v1', LISTKEY='clog_lists_v1';
let selectedQsoIds=new Set(); let holdDeleteTimer=null; let holdDeleteFired=false;
let qsos=JSON.parse(localStorage.getItem(KEY)||'[]');
let lists=JSON.parse(localStorage.getItem(LISTKEY)||'[]');
let settings=JSON.parse(localStorage.getItem(SETTINGS)||JSON.stringify({
  freq:'145.600', mode:'FM', power:'10', rx:'', tx:'', activeList:null, theme:'dark', utcRunning:true, homeLocator:'', lang:'pl', contactCache:{}
}));
if(!Array.isArray(settings.commentTemplates)) settings.commentTemplates=['POTA aktywacja','SOTA aktywacja','Praca przez przemiennik','Łączność bezpośrednia','Praca przez ISS','Dziękuję za QSO'];
while(settings.commentTemplates.length<6) settings.commentTemplates.push('');
settings.commentTemplates=settings.commentTemplates.slice(0,6);
if(typeof settings.utcRunning!=='boolean') settings.utcRunning=true;
if(!settings.contactCache||typeof settings.contactCache!=='object') settings.contactCache={};
if(!settings.lang) settings.lang='pl';


function flagForCountry(code){
  const c=String(code||'').trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(c))return '';
  return String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));
}
function locatorToLatLon(locator){
  const g=String(locator||'').trim().toUpperCase();
  if(g.length<4||g.length>6||!/^[A-R]{2}[0-9]{2}([A-X]{2})?$/.test(g))return null;
  let lon=-180+(g.charCodeAt(0)-65)*20+(Number(g[2]))*2;
  let lat=-90 +(g.charCodeAt(1)-65)*10+(Number(g[3]));
  if(g.length>=6){lon+=(g.charCodeAt(4)-65)*(5/60);lat+=(g.charCodeAt(5)-65)*(2.5/60);lon+=2.5/60;lat+=1.25/60;}
  else {lon+=1;lat+=0.5;}
  return {lat,lon};
}
function latLonToLocator(lat,lon){
  lon=Math.max(-180,Math.min(179.999999,lon));lat=Math.max(-90,Math.min(89.999999,lat));
  let x=lon+180,y=lat+90;let out='';
  const a=Math.floor(x/20),b=Math.floor(y/10);out+=String.fromCharCode(65+a,65+b);x-=a*20;y-=b*10;
  const c=Math.floor(x/2),d=Math.floor(y);out+=String(c)+String(d);x-=c*2;y-=d;
  const e=Math.floor(x/(5/60)),f=Math.floor(y/(2.5/60));out+=String.fromCharCode(65+e,65+f);
  return out;
}
function distanceKm(gridA,gridB){
  const a=locatorToLatLon(gridA),b=locatorToLatLon(gridB);if(!a||!b)return null;
  const r=6371,rad=v=>v*Math.PI/180,dl=rad(b.lat-a.lat),dn=rad(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;
  return Math.round(2*r*Math.asin(Math.sqrt(h)));
}
function contactDisplay(data){
  const code=data.countryCode||data.country_code||'';const country=data.country||data.countryName||'';const grid=data.grid||data.locator||'';
  const home=document.getElementById('contactHomeLocator')?.value.trim()||settings.homeLocator||'';
  const dist=home&&grid?distanceKm(home,grid):null;
  return [country?(flagForCountry(code)+' '+country):'',grid?'📍 '+grid:'',dist!==null?'↔ '+dist+' km':''].filter(Boolean).join(' • ');
}
async function getPhoneLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){reject(new Error('Geolokalizacja niedostępna w tej wersji aplikacji'));return;}
    navigator.geolocation.getCurrentPosition(pos=>resolve(pos),err=>reject(err),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  });
}
async function fillProjectFromPhone(project){
  try{
    const pos=await getPhoneLocation(),c=pos.coords;
    const grid=latLonToLocator(c.latitude,c.longitude);
    project.locator=grid;project.location=grid;
    project.latitude=c.latitude;project.longitude=c.longitude;
    project.telemetry=[`GPS ${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}`,`dokładność ±${Math.round(c.accuracy)} m`,c.altitude!==null?`wysokość ${Math.round(c.altitude)} m n.p.m.`:'',`czas ${new Date(pos.timestamp).toISOString()}`].filter(Boolean).join(' | ');
    saveAll();toast('Pobrano lokalizację: '+grid);showLists();
  }catch(e){toast('Nie udało się pobrać lokalizacji. Wpisz locator ręcznie.');}
}
function saveContactCache(){
  const call=(document.getElementById('callsign')?.value||'').trim().toUpperCase();if(!call){toast('Najpierw wpisz znak');return;}
  const data={name:document.getElementById('contactName')?.value.trim()||'',qth:document.getElementById('contactQth')?.value.trim()||'',grid:document.getElementById('contactGrid')?.value.trim().toUpperCase()||'',country:document.getElementById('contactCountry')?.value.trim()||'',countryCode:document.getElementById('contactCountryCode')?.value.trim().toUpperCase()||''};
  settings.contactCache[call]=data;saveAll();toast('Dane znaku zapisane w pamięci C-log');updateContactInfo(data);
}
function updateContactInfo(data){const el=document.getElementById('callerInfo');if(el){const extra=contactDisplay(data||{});el.textContent=extra||'Dane korespondenta zapisane lokalnie.';}}
function toggleUtcClock(){
  settings.utcRunning=!settings.utcRunning;
  const el=document.getElementById('qsoUtc');
  if(settings.utcRunning){if(el){el.value=utcInputValue();el.dataset.edited='0';}toast('Czas UTC uruchomiony');}
  else {if(el)el.dataset.edited='1';toast('Czas UTC zatrzymany');}
  saveAll();const b=document.getElementById('utcToggle');if(b)b.textContent=settings.utcRunning?'STOP UTC':'START UTC';
}
function t(pl,en){return settings.lang==='en'?en:pl;}
function applyTheme(){
  const theme=settings.theme||'dark';
  document.documentElement.setAttribute('data-theme',theme);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',theme==='light'?'#ffffff':theme==='green'?'#06210f':theme==='blue'?'#001a45':'#000000');
}
function showSettings(){
  document.getElementById('screen').innerHTML=`
    <div class="back"><button onclick="renderHome()">← LOGUJ</button></div>
    <div class="card">
      <h2 class="section">USTAWIENIA</h2>
      <div class="list-item"><b>JĘZYK / LANGUAGE</b><div class="theme-note">Wybór języka jest zapamiętywany. Pełne tłumaczenie wszystkich ekranów będzie wdrażane etapami.</div><select id="languageSelect" onchange="settings.lang=this.value;saveAll();showSettings()"><option value="pl" ${settings.lang==='pl'?'selected':''}>Polski</option><option value="en" ${settings.lang==='en'?'selected':''}>English</option></select><label style="margin-top:8px">Mój locator / My grid locator</label><input id="homeLocatorSetting" value="${esc(settings.homeLocator||'')}" placeholder="JO82XX" maxlength="6"><button style="width:100%;margin-top:8px" onclick="settings.homeLocator=(document.getElementById('homeLocatorSetting')?.value||'').trim().toUpperCase();saveAll();toast('Zapisano locator stacji')">ZAPISZ LOCATOR</button></div>
      <div class="list-item">
        <b>WYGLĄD</b>
        <div class="theme-note">Domyślnie: czarne tło i biała czcionka. Wybierz wygląd aplikacji.</div>
        <div class="list-actions">
          <button onclick="setTheme('dark')">● CZARNE</button>
          <button onclick="setTheme('light')">○ BIAŁE</button>
          <button onclick="setTheme('green')">● ZIELONE</button>
          <button onclick="setTheme('blue')">● NIEBIESKIE</button>
        </div>
      </div>
      <div class="list-item">
        <b>AKTUALIZACJA APLIKACJI</b>
        <div class="theme-note">C-log sprawdza najnowszą wersję bezpośrednio na GitHub i może pobrać APK aktualizacji.</div>
        <div class="list-actions">
          <button onclick="checkForUpdate()">⟳ SPRAWDŹ AKTUALIZACJĘ</button>
        </div>
      </div>
      <div class="list-item">
        <b>6 SZABLONÓW KOMENTARZY</b>
        <div class="theme-note">Edytuj teksty, które później wybierzesz podczas logowania.</div>
        ${settings.commentTemplates.map((v,i)=>`<label style="margin-top:8px">Szablon ${i+1}</label><input id="commentTemplate${i}" value="${esc(v)}" placeholder="Komentarz ${i+1}">`).join('')}
        <div class="list-actions"><button onclick="saveCommentTemplates()">ZAPISZ SZABLONY</button><button onclick="renderHome()">WRÓĆ DO LOGOWANIA</button></div>
      </div>
    </div>`;
}
function saveCommentTemplates(){
  settings.commentTemplates=Array.from({length:6},(_,i)=>(document.getElementById('commentTemplate'+i)?.value||'').trim());
  saveAll();showSettings();toast('Szablony komentarzy zapisane');
}
function checkForUpdate(){
  if(window.AndroidUpdater && AndroidUpdater.checkForUpdate){
    AndroidUpdater.checkForUpdate();
  } else {
    toast('Aktualizacje są dostępne tylko w APK Android');
  }
}
function setTheme(theme){
  settings.theme=theme;
  saveAll();
  applyTheme();
  showSettings();
  toast(({dark:'Czarne tło',light:'Białe tło',green:'Zielone tło',blue:'Niebieskie tło'})[theme]||'Zmieniono tło');
}
function saveAll(){
  localStorage.setItem(KEY,JSON.stringify(qsos));
  localStorage.setItem(LISTKEY,JSON.stringify(lists));
  localStorage.setItem(SETTINGS,JSON.stringify(settings));
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nowUTC(){
  return new Date().toISOString().slice(11,16)+' UTC';
}
function bandFromFreq(v){
  const f=Number(String(v).trim());
  if(!Number.isFinite(f)) return '';
  if(f>=0.1357&&f<=0.1378)return '2200 m';
  if(f>=0.472&&f<=0.479)return '630 m';
  if(f>=1.81&&f<=2.0)return '160 m';
  if(f>=3.5&&f<=3.8)return '80 m';
  if(f>=5.25&&f<=5.45)return '60 m';
  if(f>=7.0&&f<=7.3)return '40 m';
  if(f>=10.1&&f<=10.15)return '30 m';
  if(f>=14.0&&f<=14.35)return '20 m';
  if(f>=5.3515&&f<=5.3665)return '60 m';
  if(f>=7.0&&f<=7.2)return '40 m';
  if(f>=10.1&&f<=10.15)return '30 m';
  if(f>=14.0&&f<=14.35)return '20 m';
  if(f>=18.068&&f<=18.168)return '17 m';
  if(f>=21.0&&f<=21.45)return '15 m';
  if(f>=24.89&&f<=24.99)return '12 m';
  if(f>=28.0&&f<=29.7)return '10 m';
  if(f>=50&&f<=52)return '6 m';
  if(f>=70&&f<=70.5)return '4 m';
  if(f>=144&&f<=146)return '2 m';
  if(f>=430&&f<=440)return '70 cm';
  if(f>=1240&&f<=1300)return '23 cm';
  if(f>=2300&&f<=2450)return '13 cm';
  if(f>=3300&&f<=3500)return '9 cm';
  if(f>=5650&&f<=5850)return '6 cm';
  if(f>=10000&&f<=10500)return '3 cm';
  if(f>=24000&&f<=24250)return '1.25 cm';
  if(f>=47000&&f<=47200)return '6 mm';
  return '';
}
function sanitizeFrequency(el){
  // W trakcie pisania nie wstawiaj separatora automatycznie — nie przesuwaj kursora.
  // Dozwolone są cyfry i jedna kropka; przecinek blokuje osobna obsługa klawiatury.
  let raw=String(el.value||'').replace(/[^0-9.]/g,'');
  const dot=raw.indexOf('.');
  if(dot>=0) raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'');
  el.value=raw;
}
function blockFrequencyComma(e){if(e.key===','||e.key==='٫'){e.preventDefault();}}
function formatFrequencyOnBlur(el){
  if(!el)return;
  let v=String(el.value||'').trim().replace(/,/g,'');
  if(!v)return;
  if(v.includes('.')){
    const dot=v.indexOf('.');
    v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'').replace(/[^0-9]/g,'');
  }else{
    const digits=v.replace(/\D/g,'');
    if(digits.length>=6) v=digits.slice(0,3)+'.'+digits.slice(3);
    else if(digits.length===5) v=digits.slice(0,2)+'.'+digits.slice(2);
    else if(digits.length===4) v=digits.slice(0,1)+'.'+digits.slice(1);
    else v=digits;
  }
  el.value=v;
}
function utcInputValue(d=new Date()){return d.toISOString().slice(0,16);}
function setUtcNow(){const el=document.getElementById('qsoUtc');if(el){el.value=utcInputValue();el.dataset.edited='0';}toast('Ustawiono aktualny czas UTC');}
function getForm(){
  return {
    callsign:document.getElementById('callsign')?.value.trim().toUpperCase()||'',
    name:document.getElementById('contactName')?.value.trim()||'',
    qth:document.getElementById('contactQth')?.value.trim()||'',
    freq:document.getElementById('freq')?.value.trim()||settings.freq,
    mode:document.getElementById('mode')?.value||settings.mode,
    power:document.getElementById('power')?.value.trim()||settings.power,
    rx:document.getElementById('rx')?.value.trim()||'',
    tx:document.getElementById('tx')?.value.trim()||'',
    comment:document.getElementById('comment')?.value.trim()||'',
    qsoUtc:document.getElementById('qsoUtc')?.value||new Date().toISOString().slice(0,16)
  };
}
function updateBand(){
  const f=document.getElementById('freq')?.value||'';
  const b=bandFromFreq(f);
  const el=document.getElementById('band');
  if(el) el.textContent=b||'—';
}
function renderHome(editId=null){
  const editing=editId!==null?qsos.find(x=>x.id===editId):null;
  editingQsoId=editing?editing.id:null;
  if(!editing){settings.rx=''; settings.tx='';}
  const rememberedCall=editing?.callsign||(settings.lastCallsign||''); const rememberedName=editing?.name||(settings.lastName||''); const rememberedQth=editing?.qth||(settings.lastQth||'');
  const formFreq=editing?.freq||settings.freq, formMode=editing?.mode||settings.mode, formPower=editing?.power||settings.power;
  document.getElementById('screen').innerHTML=`

function saveQSO(){
  const f=getForm();
  if(!f.callsign){toast('Wpisz callsign.');return;}
  if(!f.rx)f.rx='59';
  if(!f.tx)f.tx='59';
  const band=bandFromFreq(f.freq)||'Nieznane';
  if(editingQsoId!==null){updateExistingQSO(f,band);return;}
  const dup=qsos.find(q=>q.callsign===f.callsign && q.band===band && q.listId===(settings.activeList||null));
  if(dup){
    showDuplicate(f,band,dup);
    return;
  }
  actuallySave(f,band);
}
function actuallySave(f,band){
  const entered=String(f.qsoUtc||'').trim();
  const t=entered?new Date(entered+'Z'):new Date();
  if(!Number.isFinite(t.getTime())){toast('Niepoprawna data lub godzina UTC');return;}
  const q={
    id:Date.now(),callsign:f.callsign,name:f.name,qth:f.qth,freq:f.freq,band,mode:f.mode,power:f.power,
    rx:f.rx,tx:f.tx,comment:f.comment,time:t.toISOString().slice(11,16)+' UTC',
    date:t.toISOString().slice(0,10),utc:t.toISOString(),listId:settings.activeList||null
  };
  qsos.unshift(q);
  settings.contactCache[f.callsign]={...(settings.contactCache[f.callsign]||{}),name:f.name,qth:f.qth,grid:document.getElementById('contactGrid')?.value.trim().toUpperCase()||'',country:document.getElementById('contactCountry')?.value.trim()||'',countryCode:document.getElementById('contactCountryCode')?.value.trim().toUpperCase()||''};
  settings.freq=String(f.freq).replace(/,/g,'');settings.mode=f.mode;settings.power=f.power;settings.lastCallsign=f.callsign;settings.lastName=f.name;settings.lastQth=f.qth;
  saveAll();
  toast('✓ QSO ZAPISANE');
  setTimeout(()=>renderHome(),500);
}
function updateExistingQSO(f,band){

  if(!Number.isFinite(t.getTime())){toast('Niepoprawna data lub godzina UTC');return;}
  qsos[idx]={...old,callsign:f.callsign,name:f.name,qth:f.qth,freq:f.freq,band,mode:f.mode,power:f.power,rx:f.rx,tx:f.tx,comment:f.comment,time:t.toISOString().slice(11,16)+' UTC',date:t.toISOString().slice(0,10),utc:t.toISOString()};
  settings.freq=String(f.freq).replace(/,/g,'');settings.mode=f.mode;settings.power=f.power;settings.lastCallsign=f.callsign;settings.lastName=f.name;settings.lastQth=f.qth;saveAll();editingQsoId=null;toast('✓ ZMIANY ZAPISANE');setTimeout(showQSOList,450);
}

function saveQRZSettings(){

  if(value){try{const u=new URL(value);if(u.protocol!=='https:'&&u.hostname!=='localhost'){toast('Użyj bezpiecznego adresu HTTPS.');return;}}catch(e){toast('Adres API jest niepoprawny.');return;}}
  settings.qrzLookupUrl=value;saveAll();toast('Konfiguracja QRZ zapisana');
}
async function lookupCallsign(){
  const call=(document.getElementById('callsign')?.value||'').trim().toUpperCase();
  const info=document.getElementById('callerInfo');
  if(!call)return;
  const cached=settings.contactCache[call];if(cached){['contactName','contactQth','contactGrid','contactCountry','contactCountryCode'].forEach((id,i)=>{const el=document.getElementById(id);const v=[cached.name,cached.qth,cached.grid,cached.country,cached.countryCode][i];if(el&&v)el.value=v;});updateContactInfo(cached);return;}
  if(!settings.qrzLookupUrl)return;
  const old=qsos.find(q=>q.callsign===call);
  if(old){
    const name=document.getElementById('contactName'),qth=document.getElementById('contactQth');
    if(name&&!name.value)name.value=old.name||'';if(qth&&!qth.value)qth.value=old.qth||'';
  }
  info.textContent='Sprawdzam dane korespondenta…';
  try{
    const url=new URL(settings.qrzLookupUrl);url.searchParams.set('callsign',call);
    const response=await fetch(url.toString(),{method:'GET',headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(data.error)throw new Error(data.error);
    const nameEl=document.getElementById('contactName'),qthEl=document.getElementById('contactQth');
    if(nameEl&&data.name)nameEl.value=data.name;
    if(qthEl&&data.qth)qthEl.value=data.qth;
    const contact={name:data.name||'',qth:data.qth||'',grid:data.grid||data.locator||'',country:data.country||data.countryName||'',countryCode:data.countryCode||data.country_code||''};
    ['contactGrid','contactCountry','contactCountryCode'].forEach((id,i)=>{const el=document.getElementById(id);const v=[contact.grid,contact.country,contact.countryCode][i];if(el&&v)el.value=v;});
    if(contact.name||contact.qth||contact.grid||contact.country)settings.contactCache[call]=contact;saveAll();updateContactInfo(contact);
  }catch(e){
    info.textContent='Lookup niedostępny: '+(e.message||'błąd połączenia')+'. Możesz wpisać dane ręcznie.';
  }
}
async function testQRZLookup(){
  saveQRZSettings();
  if(!settings.qrzLookupUrl)return;
  const call=document.getElementById('callsign')?.value.trim()||'SQ3TOM';
  toast('Testuję endpoint…');
  try{const u=new URL(settings.qrzLookupUrl);u.searchParams.set('callsign',call);const r=await fetch(u.toString(),{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();toast(d.error?'API zwróciło błąd':'Endpoint odpowiada poprawnie');}
  catch(e){toast('Test nieudany — sprawdź URL i CORS');}
}

      <div style="height:12px"></div>
      <label>Tryb</label><div class="band-value">FM SAT</div>
      <div class="list-actions">
        <button onclick="applySatSplit()">ZASTOSUJ SPLIT</button>
        <button onclick="renderHome()">ANULUJ</button>
      </div>
    </div>`;
}
function applySatSplit(){
  const up=(document.getElementById('satUplink')?.value||'').trim().replace(',','.');
  const down=(document.getElementById('satDownlink')?.value||'').trim().replace(',','.');
  const valid=v=>v!==''&&Number.isFinite(Number(v))&&Number(v)>0;
  if(!valid(up)||!valid(down)){toast('Wpisz poprawne obie częstotliwości.');return;}
  settings.satUplink=up;
  settings.satDownlink=down;
  settings.satMode=true;
  settings.freq=up;
  settings.mode='FM SAT';
  saveAll();
  renderHome();
  toast('Split SAT ustawiony');
}

function createProject(type='PROJEKT'){
  const name=prompt('Nazwa projektu / aktywacji (możesz ją później zmienić):',type==='PROJEKT'?'POTA-PL-XXXX':'PL-XXXX');
  if(!name||!name.trim())return;
  const projectType=type==='PROJEKT'?(prompt('Typ projektu: POTA, SOTA, IOTA, WWFF lub INNE','POTA')||'POTA').toUpperCase():type;
  const id=Date.now();
  const project={id,name:name.trim(),type:projectType,location:'Nie podano',locator:'',telemetry:'',start:new Date().toISOString(),status:'AKTYWNA'};
  lists.unshift(project);settings.activeList=project.name;saveAll();
  const useGps=confirm('Czy pobrać lokalizację telefonu? C-log wyznaczy locator Maidenhead (np. JO82JE) i zapisze dostępne dane GPS: współrzędne, dokładność, wysokość i czas.');
  if(useGps){fillProjectFromPhone(project);}else{
    const locator=prompt('Wpisz locator stacji lub miejsca (np. JO82JE):',settings.homeLocator||'')||'';
    const telemetry=prompt('Dodatkowe dane telemetryczne / notatki projektu (opcjonalnie):','')||'';
    project.locator=locator.trim().toUpperCase();project.location=project.locator||'Nie podano';project.telemetry=telemetry.trim();saveAll();toast('Projekt utworzony i aktywny');setTimeout(renderHome,350);
  }
}
function newList(type){createProject(type);}
function showLists(){
  document.getElementById('screen').innerHTML=`
  <div class="back"><button onclick="renderHome()">← LOGUJ</button></div>
  <div class="card"><h2 class="section">PROJEKTY I LISTY AKTYWACJI</h2>
    <button class="primary" onclick="createProject()">＋ UTWÓRZ NOWY PROJEKT</button>
    <div class="theme-note">Każdy projekt może mieć nazwę, locator i notatki telemetryczne. QSO zapisywane podczas aktywnego projektu będą do niego przypisane.</div>
  </div>
  ${lists.length?lists.map(l=>`<div class="list-item">
    <div class="list-main"><b>${esc(l.name)}</b><span>${esc(l.type)}</span></div>
    <div class="meta">📍 Locator/lokalizacja: ${esc(l.locator||l.location||'Nie podano')} • ${esc(l.status)}</div>
    ${l.telemetry?`<div class="meta">Dane telemetryczne: ${esc(l.telemetry)}</div>`:''}
    <div class="meta">QSO: ${qsos.filter(q=>q.listId===l.name).length}</div>
    <div class="list-actions"><button onclick="activateListById(${l.id})">AKTYWUJ</button><button onclick="editProject(${l.id})">EDYTUJ PROJEKT</button></div>
    <div class="list-actions"><button onclick="exportProjectADIF(${l.id})">EKSPORT ADIF PROJEKTU</button><button onclick="finishList(${l.id})">ZAKOŃCZ</button></div>
    <div class="list-actions"><button onclick="deleteList(${l.id})">USUŃ PROJEKT</button><span class="theme-note">QSO pozostaną w logu</span></div>
  </div>`).join(''):'<div class="empty">Brak projektów. Utwórz pierwszy projekt powyżej.</div>'}`;
}
function activateListById(id){const l=lists.find(x=>x.id===id);if(!l)return;settings.activeList=l.name;l.status='AKTYWNA';saveAll();toast('Aktywny projekt: '+l.name);renderHome();}
function editProject(id){
  const l=lists.find(x=>x.id===id);if(!l)return;
  const name=prompt('Nazwa projektu:',l.name);if(!name||!name.trim())return;
  const locator=prompt('Locator / lokalizacja:',l.locator||l.location||'')??(l.locator||'');
  const telemetry=prompt('Dane telemetryczne / notatki:',l.telemetry||'')??(l.telemetry||'');
  const oldName=l.name;l.name=name.trim();l.locator=locator.trim();l.location=l.locator||'Nie podano';l.telemetry=telemetry.trim();
  if(settings.activeList===oldName)settings.activeList=l.name;
  qsos.forEach(q=>{if(q.listId===oldName)q.listId=l.name;});saveAll();toast('Projekt zaktualizowany');showLists();
}
function exportProjectADIF(id){const l=lists.find(x=>x.id===id);if(!l)return;const records=qsos.filter(q=>q.listId===l.name);if(!records.length){toast('Ten projekt nie ma jeszcze QSO');return;}downloadADIF(records,safeFilename(l.name)+' .adi'.replace(' ',''),l);}
function safeFilename(name){return String(name||'C-log').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'C-log';}
function activateList(name){settings.activeList=name;saveAll();toast('Aktywna: '+name);setTimeout(renderHome,400);}
function finishList(id){
  const l=lists.find(x=>x.id===id);if(!l)return;
  l.status='ZAKOŃCZONA';if(settings.activeList===l.name)settings.activeList=null;saveAll();showLists();
}
function deleteList(id){
  const l=lists.find(x=>x.id===id); if(!l)return;
  if(!confirm('Usunąć listę „'+l.name+'”? Zapisane QSO pozostaną w logu.'))return;
  lists=lists.filter(x=>x.id!==id);
  if(settings.activeList===l.name)settings.activeList=null;
  saveAll(); toast('Lista usunięta'); showLists();
}
function adifField(name,value){
  if(value===undefined||value===null||String(value)==='')return '';
  const v=String(value);return '<'+name+':'+v.length+'>'+v;
}
function exportADIF(){
  if(!qsos.length){toast('Brak QSO do eksportu');return;}
  downloadADIF(qsos.slice().reverse(),'C-log-QSO.adi',null);
}
function downloadADIF(records,filename,project){
  const data=records.slice().reverse().map(q=>{
    const d=(q.utc||new Date().toISOString()).replace(/[-:TZ.]/g,'').slice(0,14);
    const modeMap={'FM SAT':'FM','C4FM':'C4FM','SSB':'SSB','DMR':'DMR'};
    const mode=modeMap[q.mode]||q.mode||'FM';
    const freqMHz=String(q.freq||'').replace(',','.');
    const bandMap={'2200 m':'2200M','630 m':'630M','160 m':'160M','80 m':'80M','60 m':'60M','40 m':'40M','30 m':'30M','20 m':'20M','17 m':'17M','15 m':'15M','12 m':'12M','10 m':'10M','6 m':'6M','4 m':'4M','2 m':'2M','70 cm':'70CM','23 cm':'23CM','13 cm':'13CM','9 cm':'9CM','6 cm':'6CM','3 cm':'3CM','1.25 cm':'1.25CM','6 mm':'6MM'};
    return adifField('CALL',q.callsign)+adifField('QSO_DATE',d.slice(0,8))+adifField('TIME_ON',d.slice(8,12))+adifField('BAND',bandMap[q.band]||q.band)+adifField('FREQ',freqMHz)+adifField('MODE',mode)+adifField('RST_RCVD',q.rx)+adifField('RST_SENT',q.tx)+adifField('TX_PWR',q.power)+adifField('NAME',q.name)+adifField('QTH',q.qth)+adifField('COMMENT',q.comment)+(project?adifField('MY_GRIDSQUARE',project.locator||project.location||'')+adifField('MY_SIG',project.type||'')+adifField('MY_SIG_INFO',[project.name||'',project.telemetry||''].filter(Boolean).join(' | ')):'')+'<EOR>\n';
  }).join('');
  const blob=new Blob([`ADIF Export from C-log v0.17\n<ADIF_VER:5>3.1.4\n<PROGRAMID:5>C-log\n<EOH>\n`,data],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(project?'Eksport projektu przygotowany':'Plik ADIF przygotowany — wgraj go w QRZ Logbook');
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800);}
applyTheme();
setInterval(()=>{document.getElementById('clock').textContent=nowUTC();const utc=document.getElementById('qsoUtc');if(settings.utcRunning!==false&&utc&&utc.dataset.edited!=='1')utc.value=utcInputValue();},1000);
renderHome();
</script>
