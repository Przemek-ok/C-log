plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.sq3tom.clog'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.sq3tom.clog'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
